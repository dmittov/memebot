<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Statistics - Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e0a;
            font-family: 'Courier New', Courier, monospace;
            color: #33ff33;
            padding: 20px;
            min-height: 100vh;
        }

        .terminal {
            max-width: 1200px;
            margin: 0 auto;
            background: #0d120d;
            border: 2px solid #33ff33;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(51, 255, 51, 0.3);
            overflow: hidden;
        }

        .terminal-header {
            background: #1a1f1a;
            padding: 10px 20px;
            border-bottom: 1px solid #33ff33;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .terminal-button.close { background: #ff5555; }
        .terminal-button.minimize { background: #ffff55; }
        .terminal-button.maximize { background: #55ff55; }

        .terminal-title {
            margin-left: 10px;
            color: #33ff33;
            font-weight: bold;
        }

        .terminal-body {
            padding: 20px;
        }

        .prompt {
            color: #55ff55;
            margin-bottom: 10px;
        }

        .prompt::before {
            content: "$ ";
            color: #33ff33;
        }

        h1 {
            color: #55ff55;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(51, 255, 51, 0.5);
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .stats-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #33ff33;
            color: #55ff55;
            font-weight: bold;
        }

        .stats-table td {
            padding: 12px;
            border-bottom: 1px solid #1a4d1a;
        }

        .stats-table tr:hover {
            background: rgba(51, 255, 51, 0.1);
        }

        .rank {
            color: #ffff55;
            font-weight: bold;
            width: 60px;
        }

        .username {
            color: #33ff33;
            font-weight: bold;
        }

        .emoji-list {
            color: #99ff99;
            font-size: 18px;
        }

        .total-count {
            color: #55ff55;
            font-weight: bold;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #55ff55;
        }

        .loading::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #33ff33;
            animation: blink 1s infinite;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .timestamp {
            color: #669966;
            font-size: 12px;
            margin-top: 20px;
            text-align: right;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #ffff55;
        }

        .emoji {
            display: inline-block;
            margin: 0 4px;
        }

        .count {
            color: #99ff99;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <span class="terminal-button close"></span>
            <span class="terminal-button minimize"></span>
            <span class="terminal-button maximize"></span>
            <span class="terminal-title">emoji_stats.sh</span>
        </div>
        <div class="terminal-body">
            <div class="prompt">cat /var/log/emoji_statistics.log</div>
            <h1>TOP 10 USERS BY EMOJI REACTIONS<span class="cursor"></span></h1>

            <div id="stats-container">
                <div class="loading">Loading stats</div>
            </div>

            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const response = await fetch('/emoji?format=json');
                const data = await response.json();

                const container = document.getElementById('stats-container');

                if (data.length === 0) {
                    container.innerHTML = '<div class="no-data">NO DATA AVAILABLE</div>';
                    return;
                }

                let tableHTML = `
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th class="rank">RANK</th>
                                <th class="username">USERNAME</th>
                                <th>EMOJIS RECEIVED</th>
                                <th class="total-count">TOTAL</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach((user, index) => {
                    const emojis = Object.entries(user.emojis)
                        .map(([emoji, count]) => `<span class="emoji">${emoji}</span><span class="count">×${count}</span>`)
                        .join(' ');

                    tableHTML += `
                        <tr>
                            <td class="rank">#${index + 1}</td>
                            <td class="username">@${user.username}</td>
                            <td class="emoji-list">${emojis}</td>
                            <td class="total-count">${user.total_count}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                        </tbody>
                    </table>
                `;

                container.innerHTML = tableHTML;
            } catch (error) {
                document.getElementById('stats-container').innerHTML =
                    `<div class="no-data">ERROR: ${error.message}</div>`;
            }

            // Update timestamp
            const now = new Date();
            document.getElementById('timestamp').textContent =
                `Last updated: ${now.toISOString().replace('T', ' ').substring(0, 19)} UTC`;
        }

        // Load stats on page load
        loadStats();

        // Auto-refresh every 30 seconds
        setInterval(loadStats, 30000);
    </script>
</body>
</html>
