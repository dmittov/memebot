[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
markers = [
    "pubsub: tests that require pubsub emulator",
    "live: hits real Vertex AI and runs ffmpeg; needs GCP ADC, skipped in CI",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disable_error_code = "annotation-unchecked"

[tool.isort]
profile = "black"
